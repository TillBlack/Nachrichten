name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Code prüfen (ohne Signatur)
        run: gradle compileReleaseJavaWithJavac --no-daemon
      - name: Namen der Secrets (ohne Werte)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[]' | sed 's/^/Secret: [/; s/$/]/'
      - name: Passwort vorhanden?
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Das Secret KEYSTORE_PASSWORD fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Nachrichten.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nachrichten-APK
          path: Nachrichten.apk
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste -y --cleanup-tag || true
          gh release create neueste Nachrichten.apk --title "Nachrichten – latest version" --notes "Tap Nachrichten.apk to download and install."
      - name: APK im Zweig 'apk' ablegen
        run: |
          mkdir /tmp/apk && cp Nachrichten.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Nachrichten.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk

plugins { id 'com.android.application' }

android {
    namespace 'de.nachrichten'
    compileSdk 35

    defaultConfig {
        applicationId 'de.tillblack.nachrichten'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '12'
    }

    // Der Signierschlüssel liegt passwortgeschützt im Repo.
    // Das Passwort kommt aus dem GitHub-Secret KEYSTORE_PASSWORD und steht nirgends im Code.
    signingConfigs {
        release {
            storeFile file('nachrichten.p12')
            storeType 'pkcs12'
            storePassword((System.getenv('KEYSTORE_PASSWORD') ?: '').trim())
            keyAlias 'nachrichten'
            keyPassword((System.getenv('KEYSTORE_PASSWORD') ?: '').trim())
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
